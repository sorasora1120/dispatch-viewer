<!doctype html>
<title>Dispatch — 案件リード</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root {
  --ink: #211E19;
  --ink-soft: #55504A;
  --paper: #EEEBE2;
  --paper-raised: #FBF9F3;
  --line: #D8D3C6;
  --accent: #2F6E63;
  --accent-soft: #DCEAE6;
  --accent-ink: #16403A;
  --red: #A8402F;
  --red-soft: #F3DFDA;
  --amber: #9C6B1E;
  --amber-soft: #F1E4C9;
  --cw: #3B5BA6;
  --cw-soft: #DEE6F5;
  --co: #B15A2E;
  --co-soft: #F5E2D3;
  --la: #6B4FA0;
  --la-soft: #E8E0F3;
  --shadow: 0 1px 2px rgba(33,30,25,0.06), 0 2px 10px rgba(33,30,25,0.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #EBE7DD;
    --ink-soft: #A9A296;
    --paper: #17181A;
    --paper-raised: #202225;
    --line: #34363A;
    --accent: #5FB3A3;
    --accent-soft: #1B322E;
    --accent-ink: #B7E8DC;
    --red: #E08976;
    --red-soft: #3A211D;
    --amber: #D9AE63;
    --amber-soft: #362A15;
    --cw: #8FA9E6;
    --cw-soft: #202A42;
    --co: #E0A472;
    --co-soft: #3A2A1B;
    --la: #B9A2E6;
    --la-soft: #2C2340;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 4px 16px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"] {
  --ink: #EBE7DD;
  --ink-soft: #A9A296;
  --paper: #17181A;
  --paper-raised: #202225;
  --line: #34363A;
  --accent: #5FB3A3;
  --accent-soft: #1B322E;
  --accent-ink: #B7E8DC;
  --red: #E08976;
  --red-soft: #3A211D;
  --amber: #D9AE63;
  --amber-soft: #362A15;
  --cw: #8FA9E6;
  --cw-soft: #202A42;
  --co: #E0A472;
  --co-soft: #3A2A1B;
  --la: #B9A2E6;
  --la-soft: #2C2340;
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 4px 16px rgba(0,0,0,0.35);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body { min-height: 100vh; }
.num { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding: 14px 16px 12px;
}
.brand {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 10px;
}
.brand h1 {
  margin: 0; font-size: 15px; font-weight: 800;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink);
}
.brand .stamp-row { display: flex; align-items: center; gap: 6px; }
.brand .stamp {
  font-size: 9px; letter-spacing: 0.08em; color: var(--ink-soft);
  border: 1px solid var(--line); border-radius: 3px;
  padding: 2px 6px; text-transform: uppercase;
}
.refresh-btn {
  font-size: 9px; letter-spacing: 0.05em; color: var(--accent);
  border: 1px solid var(--accent); background: none; border-radius: 3px;
  padding: 2px 6px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.searchrow { display: flex; gap: 8px; }
.searchrow input {
  flex: 1; min-width: 0;
  background: var(--paper-raised); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 12px; font-size: 15px;
  color: var(--ink); font-family: inherit;
}
.searchrow input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.main-tabs {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin-top: 10px;
}
.main-tab {
  position: relative;
  text-align: left;
  border: 1.5px solid var(--line); background: var(--paper-raised);
  border-radius: 10px; padding: 9px 10px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.main-tab .mt-title { font-size: 12.5px; font-weight: 800; color: var(--ink); line-height: 1.3; }
.main-tab .mt-sub { font-size: 10px; color: var(--ink-soft); margin-top: 1px; }
.main-tab .mt-count {
  position: absolute; top: 7px; right: 8px;
  font-size: 11px; font-weight: 800; font-family: ui-monospace, "SF Mono", Consolas, monospace;
  background: var(--paper); color: var(--ink-soft);
  border: 1px solid var(--line); border-radius: 999px;
  min-width: 20px; padding: 1px 6px; text-align: center; line-height: 1.5;
}
.main-tab[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent);
}
.main-tab[aria-pressed="true"] .mt-title,
.main-tab[aria-pressed="true"] .mt-sub { color: white; }
.main-tab[aria-pressed="true"] .mt-count {
  background: rgba(255,255,255,0.25); color: white; border-color: transparent;
}

.howto {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  font-size: 11.5px; color: var(--ink-soft);
  background: var(--accent-soft); border-radius: 8px;
  padding: 8px 10px; margin: 10px 0 0;
}
.howto b { color: var(--accent-ink); font-weight: 700; }
.howto .arrow { color: var(--ink-soft); opacity: 0.6; }

.filter-row {
  display: flex; align-items: center; gap: 10px; margin-top: 8px;
  font-size: 12px; color: var(--ink-soft); flex-wrap: wrap;
}
.filter-row select {
  font-size: 12px; font-weight: 600; color: var(--ink);
  background: var(--paper-raised); border: 1px solid var(--line);
  border-radius: 7px; padding: 5px 7px; font-family: inherit;
}

main { padding: 12px 12px 48px; max-width: 640px; margin: 0 auto; }

.stats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  margin: 4px 0 14px;
}
.stat {
  background: var(--paper-raised); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px;
}
.stat .stat-label {
  font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-soft); margin-bottom: 3px;
}
.stat .stat-value { font-size: 18px; font-weight: 800; line-height: 1.1; }
.stat .stat-value.accent { color: var(--accent-ink); }

/* 成果（応募数・採用率・今年の利益）。2026-10-08追加 */
.results {
  background: var(--paper-raised); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; margin: 4px 0 12px;
}
.results-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
/* 今日のXの投稿（2026-10-10） */
.xpost { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin: 0 0 12px; }
.xpost-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.xpost-head span { font-size: 11px; color: var(--ink-soft); }
.xpost-text { font-size: 12px; color: var(--ink-soft); white-space: pre-line; margin: 6px 0 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.xpost-text.open { display: block; }
.xpost-actions { display: flex; gap: 8px; }
.xpost-img { width: 100%; border-radius: 8px; display: block; margin: 0 0 4px; }
.xpost-hint { font-size: 11px; color: var(--ink-soft); margin: 0 0 8px; }
.xpost-btn { font-size: 12px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 6px; padding: 7px 12px; text-decoration: none; }
.xpost-next { font-size: 12px; font-weight: 600; color: var(--ink-soft); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; cursor: pointer; }
@media (max-width: 520px) { .results-row { grid-template-columns: repeat(2, 1fr); row-gap: 10px; } }
.results .r-label { font-size: 10px; color: var(--ink-soft); letter-spacing: .04em; }
.results .r-value { font-size: 18px; font-weight: 800; line-height: 1.2; }
.results .r-value small { font-size: 11px; font-weight: 700; color: var(--ink-soft); margin-left: 3px; }
.results .r-value.accent { color: var(--accent-ink); }
.goal { margin-top: 10px; }
.goal-bar { height: 8px; border-radius: 99px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; }
.goal-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--amber)); border-radius: 99px; transition: width .6s; }
.goal-text { font-size: 11px; color: var(--ink-soft); margin-top: 5px; line-height: 1.5; }
.goal-text b { color: var(--ink); }

.toolbar-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 4px 10px; gap: 8px;
}
.count-line { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.02em; }
.count-line b { color: var(--ink); }
.sort-select {
  font-size: 12px; font-weight: 600; color: var(--ink);
  background: var(--paper-raised); border: 1px solid var(--line);
  border-radius: 7px; padding: 5px 8px; font-family: inherit;
}

.date-heading {
  font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em;
  color: var(--ink-soft); text-transform: uppercase;
  padding: 14px 4px 6px;
  border-top: 1px solid var(--line);
  margin-top: 4px;
}
.date-heading:first-child { border-top: none; margin-top: 0; padding-top: 0; }

.card {
  position: relative;
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  overflow: hidden;
  padding-left: 10px;
  transition: opacity 0.15s;
}
.card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
}
.card[data-platform="CrowdWorks"]::before { background: var(--cw); }
.card[data-platform="ココナラ"]::before { background: var(--co); }
.card[data-platform="ランサーズ"]::before { background: var(--la); }
.card.is-done { opacity: 0.55; }
.card.is-done::before { background: var(--ink-soft) !important; }
.card.is-done .title a { text-decoration: line-through; text-decoration-color: var(--ink-soft); }

.card-body { padding: 12px 14px 12px 6px; }
.meta-row {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  margin-bottom: 7px;
}
.badge {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em;
  padding: 2px 7px; border-radius: 4px; text-transform: uppercase;
}
.badge.cw { background: var(--cw-soft); color: var(--cw); }
.badge.co { background: var(--co-soft); color: var(--co); }
.badge.la { background: var(--la-soft); color: var(--la); }
.badge.cat { background: var(--paper); color: var(--ink-soft); border: 1px solid var(--line); font-weight: 600; text-transform: none; letter-spacing: 0; }
.badge.status-pending { background: var(--amber-soft); color: var(--amber); }
.badge.rival-low { background: var(--accent-soft); color: var(--accent-ink); text-transform: none; }
.badge.rival-mid { background: var(--amber-soft); color: var(--amber); text-transform: none; }
.badge.rival-high { background: var(--red-soft); color: var(--red); text-transform: none; }
.badge.status-applied { background: var(--amber-soft); color: var(--amber); }
.badge.status-hired { background: var(--accent-soft); color: var(--accent-ink); }
.badge.status-ordered { background: var(--ink-soft); color: var(--paper-raised); }
.badge.deadline { background: var(--paper); color: var(--ink-soft); border: 1px solid var(--line); font-weight: 600; text-transform: none; letter-spacing: 0; }
.badge.deadline-soon { background: var(--amber-soft); color: var(--amber); border: none; font-weight: 700; text-transform: none; letter-spacing: 0; }
.badge.deadline-urgent { background: var(--red-soft); color: var(--red); border: none; font-weight: 700; text-transform: none; letter-spacing: 0; }
.meta-time { margin-left: auto; font-size: 11px; color: var(--ink-soft); }

.title {
  font-size: 15.5px; font-weight: 700; line-height: 1.45;
  margin: 0 0 8px; text-wrap: balance;
}
.title a { color: var(--ink); text-decoration: none; }
.title a:focus-visible { outline: 2px solid var(--accent); border-radius: 2px; }

.figures {
  display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  font-size: 13px; margin-bottom: 8px;
}
.figures .f-main { font-size: 16px; font-weight: 700; }
.figures .f-label { font-size: 10.5px; color: var(--ink-soft); letter-spacing: 0.04em; text-transform: uppercase; margin-right: 3px; }
.figures .margin-pos { color: var(--accent-ink); }
.quote-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 700; color: var(--amber);
  background: var(--amber-soft); border-radius: 6px; padding: 4px 9px;
  margin-bottom: 8px;
}
.hi-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 800; letter-spacing: 0.03em;
  color: var(--amber); background: var(--amber-soft);
  border-radius: 4px; padding: 2px 6px; margin-left: 4px;
}
.card.is-high::before { background: var(--amber) !important; width: 5px; }

.client-row {
  font-size: 12.5px; color: var(--ink-soft); margin-bottom: 4px;
  display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
}
.client-row .name { color: var(--ink); font-weight: 600; }

.actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.expand-btn {
  font-size: 12px; font-weight: 600; color: var(--accent);
  background: var(--accent-soft); border: none; border-radius: 6px;
  padding: 7px 11px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.expand-btn:active { transform: translateY(1px); }
.done-btn {
  font-size: 12px; font-weight: 600; color: var(--ink-soft);
  background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
  padding: 7px 11px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.done-btn[aria-pressed="true"] {
  background: var(--ink-soft); border-color: var(--ink-soft); color: var(--paper-raised);
}
.done-btn.primary-btn, .hire-btn {
  font-size: 12px; font-weight: 700; color: white;
  background: var(--accent); border: 1px solid var(--accent); border-radius: 6px;
  padding: 7px 11px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.reply-btn {
  font-size: 12px; font-weight: 700; color: var(--amber);
  background: var(--amber-soft); border: 1px solid var(--amber); border-radius: 6px;
  padding: 7px 11px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.badge.status-replied { background: var(--amber-soft); color: var(--amber); font-weight: 800; }
.reject-btn {
  font-size: 12px; font-weight: 600; color: var(--red);
  background: var(--red-soft); border: none; border-radius: 6px;
  padding: 7px 11px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}

.panels { display: none; margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
.panels.open { display: block; }
.panel { margin-bottom: 10px; }
.panel:last-child { margin-bottom: 0; }
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 5px;
}
.panel-label {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink-soft);
}
.copy-btn {
  font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
  border: 1px solid var(--accent); color: var(--accent); background: none;
  border-radius: 5px; padding: 4px 9px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.copy-btn.copied { background: var(--accent); color: white; border-color: var(--accent); }
.copy-apply-btn {
  display: block; width: 100%;
  font-size: 13px; font-weight: 700; color: white;
  background: var(--accent); border: none; border-radius: 6px;
  padding: 10px 14px; margin-top: 8px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.copy-apply-btn:active { transform: translateY(1px); }
.panel-text {
  font-size: 12.5px; line-height: 1.65; white-space: pre-wrap;
  background: var(--paper); border: 1px solid var(--line); border-radius: 7px;
  padding: 9px 10px; margin: 0; color: var(--ink);
  max-height: 220px; overflow-y: auto;
}
.panel-text.worker-msg { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; }

.empty {
  text-align: center; padding: 60px 20px; color: var(--ink-soft);
}
.empty .glyph { font-size: 28px; margin-bottom: 10px; }

footer {
  text-align: center; font-size: 11px; color: var(--ink-soft);
  padding: 18px 16px 30px; letter-spacing: 0.02em;
}
</style>

<div class="topbar">
  <div class="brand">
    <h1>Dispatch — 案件リード</h1>
    <div class="stamp-row">
      <span class="stamp" id="genAt">読込中</span>
      <button class="refresh-btn" id="refreshBtn">更新</button>
      <a class="refresh-btn" href="sales.html" style="text-decoration:none">仕入れ先</a>
    </div>
  </div>

  <div class="main-tabs" id="mainTabs">
    <button class="main-tab" data-tab="proposed" aria-pressed="true">
      <div class="mt-title">① 送れる案件</div>
      <div class="mt-sub">クライアントに応募</div>
      <div class="mt-count" id="count-proposed">0</div>
    </button>
    <button class="main-tab" data-tab="applied" aria-pressed="false">
      <div class="mt-title">② 採用待ち</div>
      <div class="mt-sub">採用されたらワーカーへ</div>
      <div class="mt-count" id="count-applied">0</div>
    </button>
    <button class="main-tab" data-tab="done" aria-pressed="false">
      <div class="mt-title">③ 発注済み</div>
      <div class="mt-sub">対応完了</div>
      <div class="mt-count" id="count-done">0</div>
    </button>
    <button class="main-tab" data-tab="pending" aria-pressed="false">
      <div class="mt-title">👀 確認前</div>
      <div class="mt-sub">まだ下書き無し</div>
      <div class="mt-count" id="count-pending">0</div>
    </button>
  </div>

  <div class="howto" id="howto"></div>

  <div class="searchrow" style="margin-top:10px;">
    <input type="search" id="q" placeholder="タイトル・依頼者で検索" autocomplete="off" />
  </div>

  <div class="filter-row">
    <select id="platSelect">
      <option value="all">全プラットフォーム</option>
      <option value="CrowdWorks" selected>CrowdWorksのみ</option>
      <option value="ココナラ">ココナラのみ</option>
      <option value="ランサーズ">ランサーズのみ</option>
    </select>
    <select id="qualitySelect">
      <option value="all">すべての案件</option>
      <option value="rival">ライバル少なめ（応募10人以下）</option>
      <option value="good">良い依頼者のみ（評価4.5以上・実績あり）</option>
      <option value="big">予算5万円以上のみ</option>
    </select>
  </div>
</div>

<main>
  <div class="results" id="results"></div>
  <div class="xpost" id="xPost" hidden></div>
  <div class="stats" id="stats"></div>
  <div class="toolbar-row">
    <div class="count-line" id="countLine"></div>
    <select class="sort-select" id="sortSelect">
      <option value="score">おすすめ順</option>
      <option value="new">新着順</option>
      <option value="margin">利益順</option>
    </select>
  </div>
  <div id="list"><div class="empty"><div class="glyph">⏳</div>読み込み中…</div></div>
</main>

<footer id="footerNote">読み込み中です…</footer>

<script src="x_posts.js"></script>
<script>
// ============================================================
// スプレッドシートからのライブデータ取得
// ============================================================
// このページはClaude Artifactではなく、静的ホスティング（GitHub Pages）上の
// 普通のWebページ。開くたびにGoogleスプレッドシートを直接読みに行くので、
// 常に最新の状態が見られる（誰かが手動でデータを再生成・再公開する必要がない）。
// 2026-08-12、「友達が最新の状態を見れない」という指摘を受けてArtifact版から移行。
//
// gvizのJSON APIはfetch()だとCORSで弾かれることがあるため、
// <script>タグでの読み込み（JSONP）で取得する。
const SHEET_ID = "1i2BtQulkchFt2dXxt9o6qLhdC7CXlBpv91EziyCp3o0";
const SHEET_NAME = "案件一覧";

// 2026-10-08、開くたびにシート全部（約7,800行・約8.7MB、9割以上は対象外の古い案件）を
// 読んでいて、スマホの通信量が多かった。使う行（提案済み・未チェック・進捗ステージ付き）と
// 使う列（I列の古い下書き・T列の募集文を除く）だけを読む。実測で約340KB・件数も一致。
// I列を抜くので、COLの番号はI列より後ろが元のシートより1つずつ前にずれている。

function cellValue(cell) {
  if (cell === null || cell === undefined) return "";
  if (cell.f !== undefined && cell.f !== null) return cell.f;
  if (cell.v === null || cell.v === undefined) return "";
  return cell.v;
}

function loadGvizJsonp(tq, sheetName = SHEET_NAME, extra = "", timeoutMs = 20000) {
  return new Promise((resolve, reject) => {
    const query = tq ? `&tq=${encodeURIComponent(tq)}` : "";
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}${query}${extra}&_=${Date.now()}`;
    window.google = window.google || {};
    window.google.visualization = window.google.visualization || {};
    window.google.visualization.Query = window.google.visualization.Query || {};
    const timeoutId = setTimeout(() => reject(new Error("timeout")), timeoutMs);
    window.google.visualization.Query.setResponse = (data) => {
      clearTimeout(timeoutId);
      resolve(data);
      delete window.google.visualization.Query.setResponse;
      script.remove();
    };
    const script = document.createElement("script");
    script.src = url;
    script.onerror = () => { clearTimeout(timeoutId); reject(new Error("script load failed")); };
    document.body.appendChild(script);
  });
}

// 開いたリンクより新しい版があれば、自動でそちらへ移る（2026-10-09）。
// 学校で github.io が開けないのでコミット固定の rawcdn.githack.com で開いていて、直すたびに新しいリンクを
// 渡していた（「毎回新しいリンクを開くのがめんどくさい」）。最新版のSHAは affiliate-pipeline の
// viewer_version.py がスプレッドシートの「設定」タブ B1 に書く。読めなければ今の版のまま開く。
async function goToLatestVersion() {
  const m = location.pathname.match(/^\/sorasora1120\/dispatch-viewer\/([0-9a-f]{40})\//);
  if (location.hostname !== "rawcdn.githack.com" || !m) return false;
  try {
    // 「設定」タブが無い時に一覧の全部を読まないよう、1行目だけにする
    const resp = await loadGvizJsonp("", "設定", "&range=A1:C1&headers=0", 5000);
    const found = JSON.stringify(resp || {}).match(/\b[0-9a-f]{40}\b/);
    if (found && found[0] !== m[1]) {
      location.replace(location.href.replace(m[1], found[0]));
      return true;
    }
  } catch (e) {
    console.warn("最新版の確認に失敗（今の版で開きます）", e);
  }
  return false;
}

// 除外語のうち、題名に「コーディング」「LPデザイン」があれば外さないもの（2026-10-10。affiliate-pipeline の
// worker_matcher.py の SOFT_EXCLUDE_KEYWORDS と同じ。「画像加工＆コーディング」「記事LPのコーディング」
// 「LPデザイン＆広告バナー制作」を落としていた。ほかの除外語にも当たる題名は外す）
const SOFT_EXCLUDE_KEYWORDS = ["バナー", "画像加工", "記事LP"];

function isExcluded(title) {
  // 英字だけの除外語（CFO・BASE など）は単語として出てきた時だけ当てる（2026-10-09、「ECFORCE」が「CFO」に当たっていた）
  const t = String(title || "");
  const low = t.normalize("NFKC").toLowerCase();
  const hits = WORKER_MATCH_EXCLUDE_KEYWORDS.filter(k => {
    if (/^[\x00-\x7f]+$/.test(k)) {
      const re = new RegExp("(^|[^a-z])" + k.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![a-z])");
      return re.test(low);
    }
    return t.includes(k);
  });
  if (!hits.length) return false;
  return !(hits.every(k => SOFT_EXCLUDE_KEYWORDS.includes(k)) && /コーディング|lpデザイン/.test(low));
}

function slim(row, statusHint) {
  return {
    platform: row[COL.platform],
    category: row[COL.category],
    title: row[COL.title],
    url: row[COL.url],
    budget: row[COL.budget],
    deadline: row[COL.deadline],
    // 「検出日時」はシート上の型がdatetime/文字列で混在しており、gvizは型推定に
    // 合わないセルをnullで返すことがある（2026-08-12発覚）。常に文字列型の
    // 「検出日」列（日付のみ・時刻なし）にフォールバックする。
    detectedAt: row[COL.detectedAt] || row[COL.detectedDate] || "",
    clientName: row[COL.clientName],
    rating: row[COL.rating],
    orderCount: row[COL.orderCount],
    margin: row[COL.margin],
    quote: row[COL.quote],
    workerMsg: row[COL.workerMsg],
    proposal: row[COL.proposal],
    status: statusHint,
    stage: row[COL.stage] || "",
    applicants: row[COL.applicants],
  };
}

// 応募済み・採用済み・発注済みは進行中の実案件なので、下の150件上限に関係なく
// 絶対に表示から漏らさない（2026-08-15発覚：提案済みが150件を超えた際、
// 古い方にあった応募済み・採用待ちの案件が丸ごと表示対象から切り捨てられ、
// 「採用待ちが0件になった」ように見えるバグがあった。表示上限は「まだ何も
// していない新着」だけにかける）。
const ACTIVE_STAGES = new Set(["applied", "replied", "hired", "ordered"]);

function buildData(rows) {
  let allProposed = rows.filter(r => r[COL.status] === "提案済み" && r[COL.workerMsg]);
  allProposed.reverse();
  const active = allProposed.filter(r => ACTIVE_STAGES.has(r[COL.stage]));
  const fresh = allProposed.filter(r => !ACTIVE_STAGES.has(r[COL.stage]));
  let proposed = active.concat(fresh.slice(0, 150)).map(r => slim(r, "proposed"));

  let pending = rows.filter(r =>
    r[COL.status] === "未チェック" &&
    WORKER_MATCH_CATEGORIES.has(r[COL.category]) &&
    !isExcluded(r[COL.title])
  );
  pending.reverse();
  pending = pending.slice(0, 60).map(r => slim(r, "pending"));

  // 成果の集計用：シート全体から、進捗ステージが付いた行と提案済みの行を軽く持っておく
  // （表示上限150件や、募集終了で「対象外」になった行も数えるため）
  const tracked = rows
    .filter(r => r[COL.stage] || r[COL.status] === "提案済み")
    .map(r => ({ url: r[COL.url], stage: r[COL.stage] || "", margin: r[COL.margin], date: String(r[COL.detectedDate] || "") }));

  return { proposed, pending, tracked };
}

let DATA = { proposed: [], pending: [], tracked: [] };

async function loadData(isManualRefresh) {
  const genAtEl = document.getElementById("genAt");
  if (isManualRefresh) genAtEl.textContent = "更新中…";
  try {
    const resp = await loadGvizJsonp(GVIZ_QUERY).catch(() => null);
    let rows;
    if (resp && resp.status !== "error" && resp.table) {
      rows = (resp.table.rows || []).map(r => (r.c || []).map(cellValue));
    } else {
      // 絞り込みが使えなかった時だけ、今までどおり全部読んで同じ並び（I列とT列以降を除く）にそろえる
      const full = await loadGvizJsonp();
      rows = (full.table.rows || []).map(r => (r.c || []).map(cellValue)).map(r => r.slice(0, 8).concat(r.slice(9, 19)));
    }
    DATA = buildData(rows);
    mergeServerStages();
    const now = new Date().toLocaleString("ja-JP", { hour12: false });
    genAtEl.textContent = "取得 " + now;
    document.getElementById("footerNote").textContent =
      "スプレッドシートから直接取得しています（最終取得: " + now + "）。「更新」でいつでも最新化できます。";
    render();
  } catch (e) {
    genAtEl.textContent = "取得失敗";
    document.getElementById("list").innerHTML =
      `<div class="empty"><div class="glyph">⚠️</div>データの取得に失敗しました。電波状況を確認して「更新」を押してください。</div>`;
    console.error(e);
  }
}

// 進捗が同期されていない古い案件」を守れず、削除してしまう恐れがあるため。
function mergeServerStages() {
  let changed = false;
  (DATA.proposed || []).forEach(it => {
    if (it.stage && stageMap[it.url] !== it.stage) {
      stageMap[it.url] = it.stage;
      changed = true;
    } else if (!it.stage) {
      const local = stageMap[it.url];
      if (local && local !== "new") {
        syncStageToServer(it.url, local);
      }
    }
  });
  if (changed) saveStageMap();
}

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function fmtBudget(item) {
  if (!item.budget || item.budget === "不明") return "予算不明";
  return item.budget;
}

// 「150,000円 〜 200,000円」のような範囲表記から数字とカンマ以外を単純に
// 取り除くと「150,000200,000」と2つの金額がくっついて表示されてしまっていた
// （2026-08-15発覚）。〜/~ の位置で分割し、それぞれ¥を付けて組み直す。
//
// 2026-10-06発覚: 上の単純な数字抽出だと「40万円」のような位取り表記から
// 「万」が読み飛ばされ、¥400,000のはずが¥40と表示されるバグがあった
// （裏側の利益計算はbudget_utils.pyが万/千を正しく解釈するため、提示額・
// 利益目安は元々正しい値で、予算の表示だけがズレていた）。
// job_scraper/src/budget_utils.pyのparse_budget_yen()と同じロジックをJSに
// 移植し、万/千を先に展開してから整形する。
function parseYenAmount(str) {
  if (!str) return null;
  const man = str.match(/([\d,]+)\s*万\s*円/);
  if (man) return parseInt(man[1].replace(/,/g, ""), 10) * 10000;
  const sen = str.match(/([\d,]+)\s*千\s*円/);
  if (sen) return parseInt(sen[1].replace(/,/g, ""), 10) * 1000;
  const plain = str.match(/[\d,]+/);
  if (plain) return parseInt(plain[0].replace(/,/g, ""), 10);
  return null;
}

function fmtBudgetAmount(item) {
  const raw = String(item.budget || "");
  const parts = raw.split(/[〜~]/).map(p => parseYenAmount(p)).filter(v => v !== null);
  if (parts.length >= 2) return `¥${parts[0].toLocaleString()}〜¥${parts[1].toLocaleString()}`;
  if (parts.length === 1) return `¥${parts[0].toLocaleString()}`;
  return "予算不明";
}

function marginYen(item) {
  const v = String(item.margin || "").replace(/[^0-9]/g, "");
  return v ? parseInt(v, 10) : -1;
}

// シートの数値は表示形式によって「18,000」のような文字列で来ることがある
function yenNum(v) {
  const n = Number(String(v || "").replace(/[^0-9.-]/g, ""));
  return isNaN(n) ? 0 : n;
}

  if (!marginKnown) {
    return `<div class="quote-badge">💬 見積り要相談（金額は交渉次第）</div>`;
  }
  // 2026-10-06、「見積り要相談の案件に金額の目安が一つも無くて提案が書けない」との
  // 指摘を受け、クライアント予算が未確定の案件も、最低予算ラインを基準にした
  // 「目安」の提示額・利益を出すようにした（worker_matcher.pyのis_estimate）。
  // 実際の予算と混同されないよう、ラベルに「目安」と明記して区別する。
  const isEstimate = !fmtBudgetAmount(item) || fmtBudgetAmount(item) === "予算不明";
  const budgetHtml = isEstimate
    ? `<span><span class="f-label">予算</span><span class="f-main num">見積り要相談</span></span>`
    : `<span><span class="f-label">予算</span><span class="f-main num">${esc(fmtBudgetAmount(item))}</span></span>`;
  const quoteHtml = item.quote
    ? `<span><span class="f-label">${isEstimate ? "目安提示額" : "提示額"}</span><span class="f-main num">¥${esc(yenNum(item.quote).toLocaleString())}</span></span>`
    : "";
  // 受注者側の手数料（予算 − 提示額 − 利益）。2026-10-07から利益は手数料を
  // 引いた後の額で計算しているので、手取りの内訳が分かるように表示する。
  const budget = budgetYen(item);
  const fee = !isEstimate && budget !== null ? budget - yenNum(item.quote) - yenNum(item.margin) : 0;
  const feeHtml = fee > 0
    ? `<span><span class="f-label">手数料</span><span class="f-main num">−¥${esc(fee.toLocaleString())}</span></span>`
    : "";
  return `<div class="figures">
    ${budgetHtml}
    ${feeHtml}
    ${quoteHtml}
    <span><span class="f-label">${isEstimate ? "目安利益" : "利益目安"}</span><span class="f-main num margin-pos">+¥${esc(yenNum(item.margin).toLocaleString())}</span></span>
  </div>`;
}

// 依頼者の評価・発注実績と予算から案件の良さを数値化する（2026-10-07、
// 「数が少ないし質もよくない」との指摘を受けて、良い案件を上に出すために追加）。
// 評価欄は「4.9 （17）」のように評価と件数がまとめて入っていることがある。
function clientRating(item) {
  const m = String(item.rating || "").match(/\d(?:\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
function clientOrderCount(item) {
  const fromRating = String(item.rating || "").match(/[（(]\s*(\d+)\s*[)）]/);
  if (fromRating) return parseInt(fromRating[1], 10);
  const n = parseInt(String(item.orderCount || "").replace(/[^0-9]/g, ""), 10);
  return isNaN(n) ? 0 : n;
}
// 実際のクライアント予算（範囲なら上限）。不明ならnull。
function budgetYen(item) {
  const parts = String(item.budget || "").split(/[〜~]/).map(parseYenAmount).filter(v => v !== null);
  return parts.length ? parts[parts.length - 1] : null;
}
// 収集時点の応募者数（CrowdWorksのみ、不明ならnull）。2026-10-08、応募しても
// 採用されない（評価0件）状態を抜けるため、ライバルが少ない案件を上に出す。
function applicantCount(item) {
  const n = parseInt(String(item.applicants ?? "").replace(/[^0-9]/g, ""), 10);
  return isNaN(n) ? null : n;
}
function rivalBadge(item) {
  const n = applicantCount(item);
  if (n === null) return "";
  const cls = n <= 5 ? "rival-low" : n <= 15 ? "rival-mid" : "rival-high";
  const label = n <= 5 ? `👥 応募${n}人・狙い目` : `👥 応募${n}人`;
  return `<span class="badge ${cls}">${esc(label)}</span>`;
}
// 「おすすめ順」の点数。2026-10-08、最初の評価を取るまで（0→1の間）は「選ばれやすさ」を優先する形に変えた。
// それまでは予算が大きいほど上に来ていて、評価0件では通りにくい10万円以上の案件に応募が集中していた
// （実測：応募58件のうち3万円以上が39件・1〜3万円は1件、返信0件）。評価が数件ついたら、予算の重みを戻してよい。
function budgetFitScore(budget) {
  // 2026-10-09、最低予算を1万円に上げた（ユーザー「1万円以上じゃなきゃダメ」。パイプラインも同じ）
  if (budget < 10000) return -2;
  if (budget <= 30000) return 2.5;   // 小さな修正・LPなど、新人でも任されやすい
  if (budget <= 80000) return 1.5;
  if (budget <= 150000) return 0;
  return -1.5;                       // 大きい案件は実績のある人が選ばれやすい
}
function daysSince(str) {
  const m = String(str || "").match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if (!m) return null;
  const d = daysUntil(`${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`);
  return d === null ? null : -d;
}
function qualityScore(item) {
  let budget = budgetYen(item);
  if (budget === null) {
    // 予算未提示は目安額（提示額＋利益）で見るが、確定額ではないので割り引く
    const est = (Number(item.quote) || 0) + (Number(item.margin) || 0);
    budget = est ? est * 0.6 : 10000;
  }
  const rating = clientRating(item);
  const count = clientOrderCount(item);
  const applicants = applicantCount(item);
  // 応募者が少ないほど、自分の提案が読まれる
  const rivalScore = applicants === null ? 0 : applicants <= 3 ? 4 : applicants <= 5 ? 3 : applicants <= 15 ? 1 : -2;
  // 出たばかりの案件ほど、まだ誰にも決まっていない
  const age = daysSince(item.detectedAt);
  const freshScore = age === null ? 0 : age <= 0 ? 2 : age <= 2 ? 1 : 0;
  return budgetFitScore(budget)
    + (rating === null ? -0.5 : (rating - 4) * 1.5)
    + Math.min(Math.log10(count + 1), 2)
    + rivalScore
    + freshScore;
}
function passesQuality(item) {
  if (state.quality === "good") {
    const r = clientRating(item);
    return r !== null && r >= 4.5 && clientOrderCount(item) > 0;
  }
  if (state.quality === "rival") {
    const n = applicantCount(item);
    return n !== null && n <= 10;
  }
  if (state.quality === "big") {
    const b = budgetYen(item);
    return b !== null && b >= 50000;
  }
  return true;
}

function clientHtml(item) {
  if (!item.clientName) return "";
  let bits = [`<span class="name">${esc(item.clientName)}</span>`];
  if (item.rating) bits.push(`評価 ${esc(item.rating)}`);
  if (item.orderCount) bits.push(`実績 ${esc(item.orderCount)}件`);
  return `<div class="client-row">👤 ${bits.join(" · ")}</div>`;
}

const HIGH_MARGIN_THRESHOLD = 15000;

function daysUntil(deadlineStr) {
  if (!deadlineStr || !/^\d{4}-\d{2}-\d{2}$/.test(deadlineStr)) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const [y, m, d] = deadlineStr.split("-").map(Number);
  const target = new Date(y, m - 1, d);
  target.setHours(0, 0, 0, 0);
  return Math.round((target - today) / 86400000);
}

function deadlineBadge(item) {
  const days = daysUntil(item.deadline);
  if (days === null) return "";
  let label;
  if (days < 0) label = "期限切れ";
  else if (days === 0) label = "本日締切";
  else label = `残り${days}日`;
  let cls = "deadline";
  if (days <= 1) cls = "deadline-urgent";
  else if (days <= 3) cls = "deadline-soon";
  return `<span class="badge ${cls}">⏰ ${esc(label)}</span>`;
}

function cardHtml(item, idx) {

    panels = `
    <div class="actions">

      ${replyBtn}

    </div>
    <div class="panels" id="panels-${idx}">

        <div class="panel-head">
          <span class="panel-label">クライアントへ送った応募文</span>
          <button class="copy-btn" data-copy="proposal-${idx}">コピー</button>
        </div>
        <pre class="panel-text" id="proposal-${idx}">${esc(item.proposal)}</pre>
      </div>
    </div>`;
  } else if (stage === "hired") {

    <div class="panels open" id="panels-${idx}">
      <div class="panel">

          <span class="panel-label">ワーカーへ（発注メッセージ）</span>
        </div>
        <pre class="panel-text worker-msg" id="worker-${idx}">${esc(item.workerMsg)}</pre>
        <button class="copy-apply-btn" data-copy-and-order="${idx}">③ コピーして発注済みにする</button>
        <a class="reply-btn" href="sales.html#order" style="text-decoration:none;display:inline-block;margin-top:8px">📦 受注してからの流れ（テンプレ）</a>
      </div>
    </div>`;
  } else if (stage === "ordered") {
    panels = `
    <div class="actions">
      <button class="expand-btn" data-toggle="${idx}" data-label="コピペ文">コピペ文を見る ▾</button>
      <!-- 2026-10-10、納品して評価と実績を残すまでのテンプレ（sales.html の「受注したら」タブ） -->
      <a class="reply-btn" href="sales.html#order" style="text-decoration:none">📦 納品・評価のテンプレ</a>
    </div>
    <div class="panels" id="panels-${idx}">
      <div class="panel">
        <div class="panel-head">
          <span class="panel-label">ワーカーへ送った内容</span>
          <button class="copy-btn" data-copy="worker-${idx}">コピー</button>
        </div>
        <pre class="panel-text worker-msg" id="worker-${idx}">${esc(item.workerMsg)}</pre>
      </div>
      <div class="panel">
        <div class="panel-head">
          <span class="panel-label">クライアントへ送った応募文</span>
          <button class="copy-btn" data-copy="proposal-${idx}">コピー</button>
        </div>
        <pre class="panel-text" id="proposal-${idx}">${esc(item.proposal)}</pre>
      </div>
    </div>`;
  } else {
    panels = `
    <div class="actions">
      <button class="expand-btn" data-toggle="${idx}" data-label="応募文">応募文を見る ▾</button>
    </div>

      <div class="panel">
        <div class="panel-head">
          <span class="panel-label">クライアントへ（応募文・下書き）</span>

    <div class="card-body">
      <div class="meta-row">
        <span class="badge ${platClass}">${esc(item.platform)}</span>
        <span class="badge cat">${esc(item.category)}</span>
        ${isPending ? '<span class="badge status-pending">未チェック</span>' : ''}
        ${stageBadge}
        ${isHigh ? '<span class="hi-badge">⭐ 高額</span>' : ''}
        ${rivalBadge(item)}
        ${deadlineBadge(item)}
        <span class="meta-time num">${esc(item.detectedAt)}</span>
      </div>
      <p class="title"><a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.title)}</a></p>
      ${figuresHtml(item)}
      ${clientHtml(item)}
      ${panels}

  </article>`;
}

// 応募数・返信数・採用数と、今年の利益（発注済みの利益目安の合計）。
// 応募 = 応募済み・返信あり・採用・発注済み・不採用、返信 = 返信あり・採用・発注済み、採用 = 採用・発注済み。
// 利益は親の確定申告ライン（会社員の副業は年20万円）と比べて残りを出す。
const TAX_LINE_YEN = 200000;
function renderResults() {
  const year = String(new Date().getFullYear());
  let applied = 0, replied = 0, hired = 0, profit = 0, ordered = 0;
  const seen = new Set();
  (DATA.tracked || []).forEach(t => {
    if (!t.url || seen.has(t.url)) return;
    seen.add(t.url);
    const stage = stageMap[t.url] || t.stage || "new";
    if (["applied", "replied", "hired", "ordered", "rejected"].includes(stage)) applied++;
    if (["replied", "hired", "ordered"].includes(stage)) replied++;
    if (stage === "hired" || stage === "ordered") hired++;
    if (stage === "ordered") {
      ordered++;
      if (!t.date || t.date.startsWith(year)) profit += Math.max(marginYen(t), 0);
    }
  });
  const rate = applied ? Math.round((hired / applied) * 1000) / 10 : 0;
  const replyRate = applied ? Math.round((replied / applied) * 1000) / 10 : 0;
  const pct = Math.min(100, Math.round((profit / TAX_LINE_YEN) * 100));
  const left = Math.max(TAX_LINE_YEN - profit, 0);
  const goalText = profit >= TAX_LINE_YEN
    ? `<b>年20万円を超えました。</b>親の確定申告が必要です（親が会社員の場合）。`
    : `確定申告ライン（親が会社員なら年20万円）まで <b>あと¥${left.toLocaleString()}</b>`;
  document.getElementById("results").innerHTML = `
    <div class="results-row">
      <div><div class="r-label">応募した</div><div class="r-value num">${applied}<small>件</small></div></div>
      <div><div class="r-label">返信が来た</div><div class="r-value num">${replied}<small>件・${replyRate}%</small></div></div>
      <div><div class="r-label">採用された</div><div class="r-value num">${hired}<small>件・${rate}%</small></div></div>
      <div><div class="r-label">${year}年の利益（発注済み）</div><div class="r-value accent num">¥${profit.toLocaleString()}</div></div>
    </div>
    <div class="goal">
      <div class="goal-bar"><i style="width:${pct}%"></i></div>
      <div class="goal-text">${goalText}${ordered ? "" : "　※「発注済み」にした案件の利益目安を足しています"}</div>
    </div>`;
}

function renderStats(items, tab) {
  const total = items.length;
  const withMargin = items.filter(it => it.margin && it.margin !== "見積り要相談");
  const sumMargin = withMargin.reduce((s, it) => s + marginYen(it), 0);

  let thirdValue;
  if (tab === "applied") {
    const waiting = items.filter(it => getStage(it.url) === "applied").length;
    const replied = items.filter(it => getStage(it.url) === "replied").length;
    const readyToOrder = items.filter(it => getStage(it.url) === "hired").length;
    thirdValue = `採用待ち ${waiting} / 返信あり ${replied} / 発注準備中 ${readyToOrder}`;
  } else {
    const platCounts = { CrowdWorks: 0, "ココナラ": 0, "ランサーズ": 0 };
    items.forEach(it => { if (platCounts[it.platform] !== undefined) platCounts[it.platform]++; });
    thirdValue = `CW ${platCounts["CrowdWorks"]} / ココ ${platCounts["ココナラ"]} / ラン ${platCounts["ランサーズ"]}`;
  }

  document.getElementById("stats").innerHTML = `
    <div class="stat">
      <div class="stat-label">件数</div>
      <div class="stat-value">${total}</div>
    </div>
    <div class="stat">
      <div class="stat-label">利益目安 合計</div>
      <div class="stat-value accent num">¥${sumMargin.toLocaleString()}</div>
    </div>
    <div class="stat">
      <div class="stat-label">内訳</div>
      <div class="stat-value" style="font-size:12px; font-weight:700; line-height:1.5;">${thirdValue}</div>
    </div>`;
}

function dateGroupLabel(detectedAt) {
  return String(detectedAt || "").slice(0, 10) || "日付不明";
}

const HOWTO_TEXT = {
  proposed: `
    <span><b>①</b>「応募文を見る」で開く</span>
    <span class="arrow">→</span>
    <span><b>②</b>緑ボタンでコピー＆応募済みにする</span>
    <span class="arrow">→</span>
    <span>クラウドワークス/ココナラに貼って応募</span>`,
  applied: `
    <span><b>返信が来たら</b>「💬 返信が来た」、<b>採用されたら</b>「② 採用された」を押す</span>
    <span class="arrow">→</span>
    <span>緑ボタンでコピー＆発注済みにする</span>
    <span class="arrow">→</span>
    <span>ワーカーに貼って送るだけ</span>`,
};

function updateTabCounts() {
  let proposedN = 0, appliedN = 0, doneN = 0;
  (DATA.proposed || []).forEach(it => {
    const stage = getStage(it.url);
    if (stage === "new") {
      const days = daysUntil(it.deadline);
      if (!(days !== null && days < 0)) proposedN++;
    } else if (stage === "applied" || stage === "replied" || stage === "hired") {
      appliedN++;
    } else if (stage === "ordered") {
      doneN++;
    }
  });
  let pendingN = 0;
  (DATA.pending || []).forEach(it => {
    if (skipSet.has(it.url)) return;
    const days = daysUntil(it.deadline);
    if (!(days !== null && days < 0)) pendingN++;
  });
  document.getElementById("count-proposed").textContent = proposedN;
  document.getElementById("count-applied").textContent = appliedN;
  document.getElementById("count-done").textContent = doneN;
  document.getElementById("count-pending").textContent = pendingN;
}

function render() {
  updateTabCounts();
  const items = state.tab === "pending" ? (DATA.pending || []) : (DATA.proposed || []);
  document.getElementById("howto").innerHTML = HOWTO_TEXT[state.tab] || "";
  document.getElementById("howto").style.display = HOWTO_TEXT[state.tab] ? "flex" : "none";

  const q = state.q.trim().toLowerCase();
  const filtered = items.filter(it => {
    if (state.plat !== "all" && it.platform !== state.plat) return false;
    if (!passesQuality(it)) return false;
    if (state.tab === "pending") {
      if (skipSet.has(it.url)) return false;
    } else {
      const stage = getStage(it.url);
      if (state.tab === "proposed" && stage !== "new") return false;
      if (state.tab === "applied" && stage !== "applied" && stage !== "replied" && stage !== "hired") return false;
      if (state.tab === "done" && stage !== "ordered") return false;
    }
    if (state.tab === "proposed" || state.tab === "pending") {
      const days = daysUntil(it.deadline);
      if (days !== null && days < 0) return false;
    }
    if (!q) return true;
    return String(it.title || "").toLowerCase().includes(q) || String(it.clientName || "").toLowerCase().includes(q);
  });

  renderStats(filtered, state.tab);
  renderResults();

  const sorted = filtered.slice();
  if (state.sort === "margin") {
    sorted.sort((a, b) => marginYen(b) - marginYen(a));
  } else if (state.sort === "score") {
    sorted.sort((a, b) => qualityScore(b) - qualityScore(a));
  }

  const list = document.getElementById("list");
  document.getElementById("countLine").innerHTML = `<b>${filtered.length}</b>件表示中`;

  if (sorted.length === 0) {
    list.innerHTML = `<div class="empty"><div class="glyph">📭</div>条件に合う案件がありません</div>`;
    return;
  }

  if (state.sort !== "new") {
    list.innerHTML = sorted.map((it, i) => cardHtml(it, i)).join("");
  } else {
    let html = "";
    let lastGroup = null;
    sorted.forEach((it, i) => {
      const g = dateGroupLabel(it.detectedAt);
      if (g !== lastGroup) {
        html += `<div class="date-heading">${esc(g)}</div>`;
        lastGroup = g;
      }
      html += cardHtml(it, i);
    });
    list.innerHTML = html;
  }

  list.querySelectorAll("[data-toggle]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-toggle");
      const panel = document.getElementById("panels-" + id);
      const open = panel.classList.toggle("open");
      const label = btn.getAttribute("data-label") || "コピペ文";
      btn.textContent = open ? `${label}を閉じる ▴` : `${label}を見る ▾`;
    });
  });
  list.querySelectorAll("[data-copy]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.getAttribute("data-copy");
      const el = document.getElementById(id);
      try {
        await navigator.clipboard.writeText(el.textContent);
        btn.textContent = "コピーしました";
        btn.classList.add("copied");
        setTimeout(() => { btn.textContent = "コピー"; btn.classList.remove("copied"); }, 1600);
      } catch (e) {
        btn.textContent = "コピー失敗";
      }
    });
  });
  // 「コピー」と「①応募した/③発注した」を別々のタップにしていたが、実際には
  // ほぼ必ずセットで行う操作なので1ボタンに統合した（2026-08-13、「もっと簡単に」
  // という要望を受けて）。コピーしてからステージを進める。
  list.querySelectorAll("[data-copy-and-apply]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.getAttribute("data-copy-and-apply");
      const el = document.getElementById("proposal-" + id);
      try { await navigator.clipboard.writeText(el.textContent); } catch (e) {}
      const url = btn.closest(".card").getAttribute("data-url");
      setStage(url, "applied");
      render();
    });
  });
  list.querySelectorAll("[data-replied-toggle]").forEach(btn => {
    btn.addEventListener("click", () => {
      const url = btn.closest(".card").getAttribute("data-url");
      setStage(url, "replied");
      render();
    });
  });
  list.querySelectorAll("[data-hired-toggle]").forEach(btn => {
    btn.addEventListener("click", () => {
      const url = btn.closest(".card").getAttribute("data-url");
      setStage(url, "hired");
      render();
    });
  });
  list.querySelectorAll("[data-copy-and-order]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.getAttribute("data-copy-and-order");
      const el = document.getElementById("worker-" + id);
      try { await navigator.clipboard.writeText(el.textContent); } catch (e) {}
      const url = btn.closest(".card").getAttribute("data-url");
      setStage(url, "ordered");
      render();
    });
  });
  list.querySelectorAll("[data-reject-toggle]").forEach(btn => {
    btn.addEventListener("click", () => {
      const url = btn.closest(".card").getAttribute("data-url");
      setStage(url, "rejected");
      render();
    });
  });
  list.querySelectorAll("[data-skip-toggle]").forEach(btn => {
    btn.addEventListener("click", () => {
      const card = btn.closest(".card");
      const url = card.getAttribute("data-url");
      skipSet.add(url);
      saveSet(SKIP_KEY, skipSet);
      render();
    });
  });
}

document.getElementById("mainTabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".main-tab");
  if (!btn) return;
  state.tab = btn.dataset.tab;
  document.querySelectorAll(".main-tab").forEach(b => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
  render();
});

document.getElementById("q").addEventListener("input", (e) => {
  state.q = e.target.value;
  render();
});

document.getElementById("platSelect").addEventListener("change", (e) => {
  state.plat = e.target.value;
  render();
});

document.getElementById("qualitySelect").addEventListener("change", (e) => {
  state.quality = e.target.value;
  render();
});

document.getElementById("sortSelect").addEventListener("change", (e) => {
  state.sort = e.target.value;
  render();
});

// 開きっぱなしのページでも「更新」で新しい版に移れるよう、データの前に版を確かめる
document.getElementById("refreshBtn").addEventListener("click", async () => {
  if (!(await goToLatestVersion())) loadData(true);
});

// 今日のXの投稿（2026-10-10、「ディスパッチビューワーにも載せて」とのこと）。文面は x_posts.js（営業ページ・Discordと共通）。
// 「Xで投稿する」はXの投稿画面を文面入りで開くだけ（自動では投稿しない）。文面を押すと全部見える
function renderXPost() {
  const box = document.getElementById("xPost");
  if (!box || typeof X_DAILY === "undefined" || !X_DAILY.length) return;
  let i = xTodayIndex();
  function draw() {
    box.innerHTML = `<div class="xpost-head"><b>📣 今日のXの投稿</b><span>${i + 1} / ${X_DAILY.length}</span></div>
      <div class="xpost-text">${esc(X_DAILY[i])}</div>
      ${xImageFor(X_DAILY[i]) ? `<img class="xpost-img" src="${esc(xImageFor(X_DAILY[i]))}" alt="投稿に付ける画像">
      <div class="xpost-hint">画像を長押しして保存し、投稿に付けてください（画像付きの方が見てもらえます）</div>` : ""}
      <div class="xpost-actions">
        <a class="xpost-btn" href="${esc(xIntentUrl(X_DAILY[i]))}" target="_blank" rel="noopener">Xで投稿する</a>
        <button class="xpost-next" type="button">別の案</button>
      </div>`;
    box.querySelector(".xpost-text").addEventListener("click", e => e.currentTarget.classList.toggle("open"));
    box.querySelector(".xpost-next").addEventListener("click", () => { i = (i + 1) % X_DAILY.length; draw(); });
  }
  box.hidden = false;
  draw();
}
renderXPost();

goToLatestVersion().then(moved => { if (!moved) loadData(false); });
</script>
