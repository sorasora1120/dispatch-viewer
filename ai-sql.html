<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>AI COMPANY SQL</title>
<style>body{margin:0;background:#0b0c0e;color:#e8e6e1;font:15px/1.6 -apple-system,system-ui,sans-serif;padding:16px}h1{font-size:18px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#d9b77e;color:#111;font:inherit;font-weight:700;margin:10px 0}pre{white-space:pre-wrap;font-size:11px;background:#15171a;border-radius:10px;padding:10px;max-height:50vh;overflow:auto}</style></head>
<body><h1>AI COMPANY：Supabase に貼る SQL</h1>
<p>① 下のボタンでコピー → ② Supabase の左メニュー「SQL Editor」→ 貼って「Run」→ 「Success. No rows returned」が出たらOK</p>
<button id="b">SQLをコピー</button><pre id="s">読み込み中…</pre>
<script>
const s=document.getElementById("s");
fetch("ai-company/supabase/migrations/0001_init.sql").then(r=>r.text()).then(t=>s.textContent=t,()=>s.textContent="読み込めませんでした");
document.getElementById("b").onclick=e=>{navigator.clipboard.writeText(s.textContent).then(()=>e.target.textContent="コピーしました",()=>{const r=document.createRange();r.selectNodeContents(s);getSelection().removeAllRanges();getSelection().addRange(r);e.target.textContent="選択したので「コピー」を押して"})};
</script></body></html>
