# Builds the VisuWord iOS app on a cloud Mac (no signing) and saves it as VisuWord.ipa,
# which can be installed on an iPhone from Windows with Sideloadly (see vocab-app/IPHONE.md).
name: iOS build check

on:
  push:
    paths:
      - 'vocab-app/**'
      - '.github/workflows/ios-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: vocab-app
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Build app from word data and copy it into the iOS project
        run: |
          node build.js
          npx cap sync ios

      - name: Compile for iPhone (unsigned)
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package VisuWord.ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry VisuWord.ipa Payload
          ls -lh VisuWord.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: VisuWord-ipa
          path: ${{ runner.temp }}/ipa/VisuWord.ipa
          retention-days: 30
