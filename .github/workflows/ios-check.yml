# Builds the VisuWord iOS app on a cloud Mac (no signing) to prove the Xcode project compiles.
name: iOS build check

on:
  push:
    paths:
      - 'vocab-app/**'
      - '.github/workflows/ios-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: vocab-app
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Build app from word data and copy it into the iOS project
        run: |
          node build.js
          npx cap sync ios

      - name: Compile for the iOS Simulator (unsigned)
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
