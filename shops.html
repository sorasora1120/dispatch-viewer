<html lang="ja">
<head>

<title>Windsor お店マップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<style>
/* Windsor の「自分のサイトがない個人のお店」の地図（2026-10-21、「windsorの行ける店全部調べて、Googleマップにのせて」）。
   データは Overture Maps（オープンデータ）。作り方は tools/windsor_shops.py。印（興味あり・行った など）はこの端末のブラウザにだけ保存 */
:root{--bg:#f5f1ea;--card:#fffdf9;--ink:#1b1714;--mute:#6f6760;--line:rgba(27,23,20,.12);--acc:#b3122d;
  --g1:#e4572e;--g2:#c2187a;--g3:#2a7ab0;--g4:#3a9a56;--g5:#6b6b6b;--g6:#c98a12}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
header{position:sticky;top:0;z-index:1000;background:#14110f;color:#f5f1ea;padding:10px 14px 8px;padding-top:calc(10px + env(safe-area-inset-top))}
header h1{font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
header h1 small{font-size:12px;font-weight:400;color:#bdb3a8}
.row{display:flex;gap:6px;align-items:center;margin-top:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 11px;border-radius:999px;border:1px solid rgba(245,241,234,.25);font-size:13px;white-space:nowrap;color:#f5f1ea}
.chip[aria-pressed=true]{background:#f5f1ea;color:#14110f;border-color:#f5f1ea}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.tools{display:flex;gap:6px;margin-top:8px}
.tools input{flex:1;min-width:0;padding:8px 10px;border-radius:9px;border:0;font-size:15px;background:#2a2521;color:#f5f1ea}
.tools input::placeholder{color:#9b9087}
.btn{flex:0 0 auto;padding:8px 11px;border-radius:9px;background:var(--acc);color:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.btn.ghost{background:#2a2521;color:#f5f1ea}
.views{display:flex;gap:0;margin-top:8px;background:#2a2521;border-radius:9px;padding:3px}
.views button{flex:1;padding:6px;border-radius:7px;font-size:13px;color:#cfc6bc}
.views button[aria-pressed=true]{background:#f5f1ea;color:#14110f;font-weight:600}
#map{position:fixed;left:0;right:0;bottom:0;top:var(--top,190px)}
#list{display:none;padding:12px 12px 80px;max-width:760px;margin:0 auto}
body.listmode #map{display:none}
body.listmode #list{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:10px}
.card h3{font-size:16px;line-height:1.35}
.meta{color:var(--mute);font-size:13px;margin-top:2px}
.meta b{font-weight:600;color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.acts a,.acts button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;text-decoration:none;background:#fff}
.acts a.go{background:#1a73e8;border-color:#1a73e8;color:#fff;font-weight:600}
.acts button[aria-pressed=true]{background:#14110f;color:#fff;border-color:#14110f}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;color:#fff;margin-right:6px;vertical-align:1px}
.st{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:#efe7db;margin-left:6px;vertical-align:1px}
.dist{float:right;font-size:12.5px;color:var(--mute);margin-left:8px}
.more{display:block;width:100%;padding:12px;border-radius:10px;background:#14110f;color:#fff;font-weight:600;margin:6px 0 16px}
.help{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:4px 0 14px;font-size:14px}
.help summary{font-weight:700;cursor:pointer}
.help ol{padding-left:20px;margin-top:8px}
.help li{margin:4px 0}
.help .acts a{background:#fff}
.note{font-size:12.5px;color:var(--mute);margin:8px 2px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.dot.s-like{outline:3px solid #ffd166}
.dot.s-done{opacity:.45}
.dot.s-skip,.dot.s-site{opacity:.25}
.leaflet-popup-content{margin:12px 14px;font:14px/1.5 -apple-system,"Hiragino Sans",system-ui,sans-serif}
.leaflet-popup-content h3{font-size:15px;margin-bottom:2px}
.leaflet-popup-content .acts a.go{color:#fff}
.me{width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14110f;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

      <li>パソコンかiPadのブラウザで <a href="https://www.google.com/maps/d/" target="_blank" rel="noopener">Google マイマップ</a> を開き、「新しい地図を作成」→「インポート」で、そのファイルを選ぶ</li>

  </details>
  <p class="note" id="srcnote"></p>
  <div id="cards"></div>
  <button class="more" id="moreBtn">もっと見る</button>
</main>
<div class="toast" id="toast"></div>

"lat":42.330471,"lon":-82.955376,"p":"+15199449115","s":["https://www.facebook.com/241959752593359"],"k":0.85},{"n":"Carm's Barbershop","g":"美容","c":"床屋","a":"7045 Wyandotte St E","t":"Windsor","lat":42.331478,"lon":-82.95351,"p":"+12266200726","s":["https://www.facebook.com/1535830233405581"],"k":0.98},{"n":"F&B Hospitality Group","g":"飲食","c":"レストラン","a":"2090 Wyandotte St E Lower","t":"Windsor","lat":42.323582,"lon":-83.011311,"p":"+15192568080","s":["https://www.facebook.com/987120321347399"],"k":0.92},{"n":"Riverside Residence","g":"車","c":"タイヤ","a":"511 Devonshire Rd","t":"Windsor","lat":42.323566,"lon":-83.012569,"p":"+15192533618","s":["https://www.facebook.com/768022143063139"],"k":0.79},{"n":"Hanan Beauty Spa","g":"美容","c":"エステ・美容","a":"378 Devonshire Rd","t":"Windsor","lat":42.324789,"lon":-83.013042,"p":"+18665716165","s":["https://www.facebook.com/104731714955362","https://hannanbeautyspa.square.site/"],"k":1.0},{"n":"Canadian Club. Hiram Walker","g":"飲食","c":"レストラン","a":"1950 Riverside Dr E","t":"Windsor","lat":42.32612,"lon":-83.012516,"p":"","s":["https://www.facebook.com/262282721157606"],"k":0.62},{"n":"Lot No. 40","g":"飲食","c":"バー","a":"2072 Riverside Dr E","t":"Windsor","lat":42.326021,"lon":-83.012199,"p":"+15195615684","s":["https://www.facebook.com/295695014288893"],"k":0.66},{"n":"The Don's Pizza","g":"飲食","c":"ピザ","a":"8582 Riverside Dr E 409","t":"Windsor","lat":42.342541,"lon":-82.939514,"p":"+15199454128","s":["https://www.facebook.com/107704304097881"],"k":0.66}]/*END*/;
const UPDATED = "2026年9月の版";
const GROUPS = [["飲食", "var(--g1)"], ["美容", "var(--g2)"], ["お店", "var(--g3)"], ["教室・ジム", "var(--g4)"], ["車", "var(--g5)"], ["サービス", "var(--g6)"]];
const COLOR = Object.fromEntries(GROUPS.map(([g, c]) => [g, getComputedStyle(document.documentElement).getPropertyValue(c.slice(4, -1)).trim()]));
const STATES = [["", "未チェック"], ["like", "⭐ 興味あり"], ["done", "✓ 行った"], ["skip", "✕ 見送り"], ["site", "🌐 サイトあった"]];
const SKEY = "windsor-shops-v1";
let marks = {};
try { marks = JSON.parse(localStorage.getItem(SKEY) || "{}"); } catch (e) { marks = {}; }
const keyOf = s => s.n + "@" + s.lat.toFixed(4) + "," + s.lon.toFixed(4);
function saveMarks() { try { localStorage.setItem(SKEY, JSON.stringify(marks)); } catch (e) {} }

let group = "すべて", state = "all", query = "", me = null, shown = 60;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1800); }

// ---- 絞り込み ----
function drawChips() {
  $("groups").innerHTML = [["すべて", ""]].concat(GROUPS).map(([g, c]) =>
    `<button class="chip" data-g="${esc(g)}" aria-pressed="${g === group}">${c ? `<i style="background:${c}"></i>` : ""}${esc(g)}</button>`).join("");
  const opts = [["all", "全部の印"], ["", "未チェック"], ["like", "⭐ 興味あり"], ["done", "✓ 行った"], ["skip", "✕ 見送り"], ["site", "🌐 サイトあった"]];
  $("states").innerHTML = opts.map(([k, t]) => `<button class="chip" data-s="${k}" aria-pressed="${k === state}">${esc(t)}</button>`).join("");
}
function matches(s) {
  if (group !== "すべて" && s.g !== group) return false;
  const m = marks[keyOf(s)] || "";
  if (state !== "all" && m !== state) return false;
  if (query) {
    const hay = (s.n + " " + s.c + " " + s.g + " " + s.a + " " + s.t).toLowerCase();
    if (!query.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}
function distM(s) {
  if (!me) return null;
  const R = 6371000, r = Math.PI / 180;
  const x = (s.lon - me[1]) * r * Math.cos((s.lat + me[0]) / 2 * r), y = (s.lat - me[0]) * r;
  return Math.round(R * Math.hypot(x, y));
}
const fmtDist = m => m == null ? "" : m < 1000 ? `${m}m` : `${(m / 1000).toFixed(1)}km`;
function gmaps(s) { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s.n + ", " + s.a + ", " + s.t + ", ON"); }
function socialLinks(s) {
  return (s.s || []).map(u => {
    const label = /instagram/i.test(u) ? "Instagram" : /facebook/i.test(u) ? "Facebook" : "SNS";
    return `<a href="${esc(u)}" target="_blank" rel="noopener">${label}</a>`;
  }).join("");
}
function actsHtml(s, i) {
  const m = marks[keyOf(s)] || "";
  const btns = STATES.slice(1).map(([k, t]) => `<button data-mark="${k}" data-i="${i}" aria-pressed="${m === k}">${esc(t)}</button>`).join("");
  return `<div class="acts"><a class="go" href="${gmaps(s)}" target="_blank" rel="noopener">Google マップで開く</a>` +
    (s.p ? `<a href="tel:${esc(s.p)}">電話</a>` : "") + socialLinks(s) + `</div><div class="acts">${btns}</div>`;
}
function infoHtml(s, i, withDist) {
  const m = marks[keyOf(s)] || "";
  const st = m ? `<span class="st">${esc(STATES.find(x => x[0] === m)[1])}</span>` : "";
  const d = withDist ? `<span class="dist">${fmtDist(distM(s))}</span>` : "";
  return `${d}<h3>${esc(s.n)}${st}</h3><div class="meta"><span class="tag" style="background:${COLOR[s.g]}">${esc(s.g)}</span><b>${esc(s.c)}</b> ・ ${esc(s.a)}${s.t !== "Windsor" ? "（" + esc(s.t) + "）" : ""}</div>` + actsHtml(s, i);
}

// ---- 地図 ----
const map = L.map("map", { zoomControl: false, preferCanvas: true }).setView([42.29, -82.99], 12);
L.control.zoom({ position: "bottomright" }).addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap ・ データ: Overture Maps" }).addTo(map);
const cluster = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 46, spiderfyOnMaxZoom: true });
map.addLayer(cluster);
let meMarker = null;
function dotIcon(s) {
  const m = marks[keyOf(s)] || "";
  return L.divIcon({ className: "", iconSize: [14, 14], html: `<div class="dot${m ? " s-" + m : ""}" style="background:${COLOR[s.g]}"></div>` });
}
let markers = [];
function drawMap() {
  cluster.clearLayers();
  markers = [];
  SHOPS.forEach((s, i) => {
    if (!matches(s)) return;
    const mk = L.marker([s.lat, s.lon], { icon: dotIcon(s), title: s.n });
    mk.bindPopup(() => infoHtml(s, i, !!me), { maxWidth: 290 });
    mk._i = i;
    markers.push(mk);
  });
  cluster.addLayers(markers);
}

// ---- リスト ----
function filtered() {
  const arr = SHOPS.map((s, i) => [s, i]).filter(([s]) => matches(s));
  if (me) arr.sort((a, b) => distM(a[0]) - distM(b[0]));
  else arr.sort((a, b) => (a[0].t + a[0].a).localeCompare(b[0].t + b[0].a));
  return arr;
}
function drawList() {
  const arr = filtered();
  $("cards").innerHTML = arr.slice(0, shown).map(([s, i]) => `<div class="card">${infoHtml(s, i, !!me)}</div>`).join("") ||
    `<p class="note">合うお店がありません。絞り込みを「すべて」にしてみてください。</p>`;
  $("moreBtn").style.display = arr.length > shown ? "" : "none";
  $("moreBtn").textContent = `もっと見る（あと${arr.length - shown}件）`;
}
function drawCount() {
  const n = SHOPS.filter(matches).length;
  const done = Object.values(marks).filter(v => v === "done").length;
  $("count").textContent = `${n}件` + (done ? `・行った${done}` : "");
}
function redraw() { drawChips(); drawCount(); drawMap(); drawList(); }

// ---- 操作 ----
document.addEventListener("click", e => {
  const g = e.target.closest("[data-g]"); if (g) { group = g.dataset.g; shown = 60; redraw(); return; }
  const st = e.target.closest("[data-s]"); if (st) { state = st.dataset.s; shown = 60; redraw(); return; }
  const mk = e.target.closest("[data-mark]");
  if (mk) {
    const s = SHOPS[+mk.dataset.i], k = keyOf(s), v = mk.dataset.mark;
    if (marks[k] === v) delete marks[k]; else marks[k] = v;
    saveMarks();
    toast(marks[k] ? STATES.find(x => x[0] === v)[1] + " にしました" : "印を外しました");
    map.closePopup();
    redraw();
  }
});
let qt = null;
$("q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { query = e.target.value.trim(); shown = 60; redraw(); }, 250); });
$("moreBtn").addEventListener("click", () => { shown += 60; drawList(); });
function setView(list) {
  document.body.classList.toggle("listmode", list);
  $("vMap").setAttribute("aria-pressed", !list); $("vList").setAttribute("aria-pressed", list);
  if (!list) setTimeout(() => map.invalidateSize(), 50);
  try { localStorage.setItem(SKEY + "-view", list ? "list" : "map"); } catch (e) {}
}
$("vMap").addEventListener("click", () => setView(false));
$("vList").addEventListener("click", () => setView(true));
$("near").addEventListener("click", () => {
  if (!navigator.geolocation) { toast("この端末では場所が使えません"); return; }
  toast("今いる場所を調べています…");
  navigator.geolocation.getCurrentPosition(pos => {
    me = [pos.coords.latitude, pos.coords.longitude];
    if (meMarker) meMarker.remove();
    meMarker = L.marker(me, { icon: L.divIcon({ className: "", iconSize: [16, 16], html: '<div class="me"></div>' }), zIndexOffset: 1000 }).addTo(map);
    map.setView(me, 15);
    shown = 60; redraw();
    toast("近い順にしました");
  }, () => toast("場所が使えませんでした（設定で位置情報をオンに）"), { enableHighAccuracy: true, timeout: 10000 });
});

// ---- Google マイマップ用のファイル ----
function download(name, text, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const xml = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
$("kml").addEventListener("click", () => {
  const list = SHOPS.filter(matches);
  const byG = {};
  list.forEach(s => (byG[s.g] = byG[s.g] || []).push(s));
  const folders = Object.entries(byG).map(([g, arr]) => `<Folder><name>${xml(g)}</name>` + arr.map(s =>
    `<Placemark><name>${xml(s.n)}</name><description>${xml(s.c + " / " + s.a + (s.p ? " / " + s.p : ""))}</description>` +
    `<Point><coordinates>${s.lon},${s.lat},0</coordinates></Point></Placemark>`).join("") + `</Folder>`).join("");
  download("windsor-shops.kml", `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Windsor お店（サイトなし）</name>${folders}</Document></kml>`,
    "application/vnd.google-earth.kml+xml");
  toast(`${list.length}件をKMLにしました`);
});
$("csv").addEventListener("click", () => {
  const list = SHOPS.filter(matches);
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const rows = [["名前", "分け", "種類", "住所", "町", "緯度", "経度", "電話", "SNS", "Googleマップ"].map(q).join(",")].concat(
    list.map(s => [s.n, s.g, s.c, s.a, s.t, s.lat, s.lon, s.p, (s.s || []).join(" "), gmaps(s)].map(q).join(",")));
  download("windsor-shops.csv", "﻿" + rows.join("\n"), "text/csv");
  toast(`${list.length}件をCSVにしました`);
});

// ---- はじめ ----
function fitTop() { document.documentElement.style.setProperty("--top", $("hdr").offsetHeight + "px"); map.invalidateSize(); }
addEventListener("resize", fitTop);
$("srcnote").textContent = `データ: Overture Maps（オープンデータ、${UPDATED}）。チェーン店・病院・役所などを除いた、自分のサイトが登録されていない個人のお店です。` +
  `古いこともあるので、行く前に Google マップで「開いているか」「ウェブサイトのボタンが無いか」を確かめてください。印（⭐・✓など）はこの端末にだけ保存されます。`;
redraw();
fitTop();
try { map.fitBounds(cluster.getBounds(), { padding: [20, 20] }); } catch (e) {}
try { if (localStorage.getItem(SKEY + "-view") === "list") setView(true); } catch (e) {}
</script>
